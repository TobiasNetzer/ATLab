name: Release Build

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  user-guide:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install documentation tools
      run: |
        pip install -r scripts/requirements-docs.txt
        python -m playwright install --with-deps chromium
        sudo apt-get update
        sudo apt-get install -y fonts-inter

    - name: Build user guide PDFs (English and German)
      run: |
        mkdir -p user-guide-pdf
        for lang in en de; do
          python scripts/build_user_guide_pdf.py \
            --lang "$lang" \
            --version "${{ github.ref_name }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            --output "user-guide-pdf/ATLab-User-Guide-$lang.pdf"
        done

    - name: Upload user guide artifact
      uses: actions/upload-artifact@v4
      with:
        name: user-guide
        path: user-guide-pdf/*.pdf
        if-no-files-found: error
        retention-days: 1

  build-matrix:
    needs: user-guide
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Publishing for a specific runtime identifier (RID) copies only the native
    # libraries for that platform next to ATLab.exe, instead of a "runtimes"
    # folder with binaries for every platform. The app stays framework-dependent.
    - name: Restore
      run: |
        dotnet restore src/ATLab/ATLab.csproj -r ${{ matrix.rid }}
        dotnet restore src/ATLab.Analyzer/ATLab.Analyzer.csproj -r ${{ matrix.rid }}

    - name: Build
      run: dotnet publish src/ATLab/ATLab.csproj -c Release -r ${{ matrix.rid }} --self-contained false --no-restore -o out

    # ATLab Analyzer gets its own folder: both apps share libraries (Avalonia, ShadUI, ...) and each has its own
    # .deps.json, so one app can never overwrite a file of the other. Packages and installer take all of out.
    - name: Build ATLab Analyzer
      run: dotnet publish src/ATLab.Analyzer/ATLab.Analyzer.csproj -c Release -r ${{ matrix.rid }} --self-contained false --no-restore -o out/Analyzer

    # User guides are shipped with every package in out/docs
    - name: Add user guide PDFs
      uses: actions/download-artifact@v4
      with:
        name: user-guide
        path: out/docs

    # Linux packaging
    - name: Package Linux build
      if: matrix.os == 'ubuntu-latest'
      run: |
        tar -czf ATLab-linux.tar.gz -C out .
      shell: bash

    # Windows packaging + NSIS
    - name: Install NSIS
      if: matrix.os == 'windows-latest'
      run: choco install nsis -y

    - name: Build NSIS installer
      if: matrix.os == 'windows-latest'
      run: |
        cd Installers/Windows
        & "C:\Program Files (x86)\NSIS\makensis.exe" ATLab_Setup.nsi

    - name: Package Windows build
      if: matrix.os == 'windows-latest'
      run: |
        powershell Compress-Archive -Path out\* -DestinationPath ATLab-win.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-artifacts
        path: |
          ATLab-linux.tar.gz
          ATLab-win.zip
          Installers/Windows/ATLab-setup.exe
        if-no-files-found: ignore

  create-release:
    needs: build-matrix
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Linux artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/ubuntu-latest-artifacts/ATLab-linux.tar.gz
          asset_name: ATLab-linux-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Windows ZIP artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/windows-latest-artifacts/ATLab-win.zip
          asset_name: ATLab-win-${{ github.ref_name }}.zip
          asset_content_type: application/zip

      - name: Upload Windows NSIS installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/windows-latest-artifacts/Installers/Windows/ATLab-setup.exe
          asset_name: ATLab-setup-${{ github.ref_name }}.exe
          asset_content_type: application/octet-stream